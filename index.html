<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        :root {
            --bg: #f0f0f0;
            --text: #333;
            --panel-bg: #fff;
            --panel-border: #ccc;
        }

        body.dark-mode {
            --bg: #1a1a2e;
            --text: #eee;
            --panel-bg: #16213e;
            --panel-border: #444;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        h1 {
            color: var(--text);
        }

        .back-btn {
            display: inline-block;
            background: var(--panel-bg);
            color: #5865f2;
            border: 2px solid #5865f2;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #5865f2;
            color: white;
        }

        #topBar {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #themeToggle {
            background-color: var(--panel-bg);
            color: var(--text);
            border: 2px solid var(--panel-border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        #themeToggle:hover {
            opacity: 0.8;
        }

        #difficulty-controls {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            background-color: var(--panel-bg);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }

        #difficultySelect {
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }

        #controls {
            margin: 20px 0;
            text-align: center;
        }
        #moves {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        #restartButton {
            background-color: #f39c12;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
            display: none; 
            margin-top: 10px;
        }
        #restartButton:hover {
            background-color: #e67e22;
        }
        #tester-controls {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid var(--panel-border);
            border-radius: 5px;
            background-color: var(--panel-bg);
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
        }
        #passwordInput {
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }
        #testerButton, #exitTesterButton {
            padding: 5px 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        #exitTesterButton {
            background-color: #95a5a6;
            display: none;
        }
        #testerButton:hover { background-color: #2980b9; }
        #exitTesterButton:hover { background-color: #7f8c8d; }

        /* Stili della griglia e delle carte */
        #game-board {
            display: grid;
            gap: 10px;
            padding: 20px;
            background-color: #5865f2;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 1;
            transition: opacity 0.5s;
        }
        .card {
            width: 90px;
            height: 90px;
            background-color: #36393f;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 2.6em;
            color: transparent; 
            transition: transform 0.3s, background-color 0.3s, color 0.3s;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .card::selection {
            background: transparent;
            color: transparent;
        }
        .card.flipped, .card.preview, .card.debug-active {
            background-color: #ecf0f1; 
            color: black;
            pointer-events: none;
        }
        .card.matched {
            background-color: #2ecc71; 
            pointer-events: none;
            color: white;
            opacity: 0.8;
        }
        .card.debug-active {
            background-color: #e74c3c; 
            color: white;
            opacity: 1;
        }
    </style>
</head>
<body>

    <a href="https://noskynhk.github.io/gamehub/" class="back-btn">🎮 Torna alla Game Hub</a>

    <h1>Emoji Memory Game</h1>

    <div id="topBar">
        <button id="themeToggle">🌙 Dark Mode</button>
    </div>

    <div id="difficulty-controls">
        <label for="difficultySelect">Difficoltà:</label>
        <select id="difficultySelect">
            <option value="easy">Facile (4x4)</option>
            <option value="medium">Medio (4x6)</option>
            <option value="hard">Difficile (6x6)</option>
        </select>
    </div>
    
    <div id="tester-controls">
        <label for="passwordInput">Tester Mode:</label>
        <input type="password" id="passwordInput" placeholder="Inserisci Password">
        <button id="testerButton">Attiva</button>
        <button id="exitTesterButton" style="display: none;">Esci da Tester Mode</button>
        <p id="testerMessage" style="color:red; margin-top: 5px; font-size: 0.9em;"></p>
    </div>

    <div id="controls">
        <div id="moves">Mosse: 0</div>
        <button id="restartButton">Riprova</button>
    </div>

    <div id="game-board"></div>

    <script>
        const EMOJI_POOL = [
            '🦊', '🦁', '🐻', '🐼', '🐵', '🐸', '🐺', '🦉',
            '🐯', '🐨', '🐮', '🐷', '🐔', '🐧', '🦄', '🐙',
            '🦋', '🐝'
        ];

        const DIFFICULTY = {
            easy:   { pairs: 8,  cols: 4 },
            medium: { pairs: 12, cols: 6 },
            hard:   { pairs: 18, cols: 6 }
        };

        const CORRECT_PASSWORD = '4468';
        let isDebugMode = false;
        let currentDifficulty = 'easy';

        const gameBoard = document.getElementById('game-board');
        const movesDisplay = document.getElementById('moves');
        const restartButton = document.getElementById('restartButton');
        const passwordInput = document.getElementById('passwordInput');
        const testerButton = document.getElementById('testerButton');
        const exitTesterButton = document.getElementById('exitTesterButton');
        const testerMessage = document.getElementById('testerMessage');
        const difficultySelect = document.getElementById('difficultySelect');
        const themeToggle = document.getElementById('themeToggle');

        let shuffledCards = [];
        let flippedCards = []; 
        let matchedPairs = 0;
        let totalPairs = DIFFICULTY[currentDifficulty].pairs;
        let moves = 0;
        let lockBoard = true; 

        // --- Dark / Light Mode ---
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeToggle.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
        });

        // --- Selettore Difficoltà ---
        difficultySelect.addEventListener('change', () => {
            currentDifficulty = difficultySelect.value;
            initGame();
        });

        // --- Gestione Tester Mode ---

        testerButton.addEventListener('click', () => {
            if (passwordInput.value === CORRECT_PASSWORD) {
                isDebugMode = true;
                testerMessage.textContent = 'Modalità Tester Attivata! ✅';
                testerMessage.style.color = '#2ecc71';
                
                passwordInput.style.display = 'none';
                testerButton.style.display = 'none';
                exitTesterButton.style.display = 'inline-block';
                testerMessage.style.display = 'inline';
                
                updateDebugState(); 
                lockBoard = false;
            } else {
                testerMessage.textContent = 'Password errata.';
                testerMessage.style.color = '#e74c3c';
            }
        });

        exitTesterButton.addEventListener('click', () => {
            isDebugMode = false;
            testerMessage.textContent = 'Modalità Tester Disattivata.';
            testerMessage.style.color = '#333';
            
            passwordInput.style.display = 'inline';
            testerButton.style.display = 'inline';
            exitTesterButton.style.display = 'none';
            
            updateDebugState(); 
            lockBoard = false; 
        });

        function updateDebugState() {
            const allCards = document.querySelectorAll('.card');
            allCards.forEach(card => {
                if (isDebugMode) {
                    card.classList.add('debug-active');
                } else {
                    card.classList.remove('debug-active');
                    if (!card.classList.contains('matched')) {
                        card.classList.remove('flipped');
                    }
                }
            });
        }
        
        // --- Logica di Gioco Standard ---
        
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function buildDeck() {
            const { pairs } = DIFFICULTY[currentDifficulty];
            const chosenEmojis = EMOJI_POOL.slice(0, pairs);
            return shuffle([...chosenEmojis, ...chosenEmojis]);
        }

        function initGame() {
            const { cols, pairs } = DIFFICULTY[currentDifficulty];
            totalPairs = pairs;

            shuffledCards = buildDeck();
            gameBoard.innerHTML = '';
            gameBoard.style.gridTemplateColumns = `repeat(${cols}, 90px)`;

            moves = 0;
            movesDisplay.textContent = 'Mosse: 0';
            matchedPairs = 0;
            flippedCards = [];
            restartButton.style.display = 'none';

            if (!isDebugMode) {
                testerMessage.textContent = '';
                passwordInput.style.display = 'inline';
                testerButton.style.display = 'inline';
                exitTesterButton.style.display = 'none';
            }

            shuffledCards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji; 
                card.dataset.index = index; 
                card.textContent = emoji;
                
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
            
            if (isDebugMode) {
                updateDebugState();
                lockBoard = false; 
            } else {
                showPreview();
            }
        }

        function showPreview() {
            lockBoard = true;
            const allCards = document.querySelectorAll('.card');
            
            allCards.forEach(card => card.classList.add('preview'));

            setTimeout(() => {
                allCards.forEach(card => card.classList.remove('preview'));
                lockBoard = false;
            }, 2000); 
        }

        function flipCard() {
            if (lockBoard || isDebugMode) return; 
            if (this === flippedCards[0]) return; 

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = `Mosse: ${moves}`;
                checkForMatch();
            }
        }

        function checkForMatch() {
            let [card1, card2] = flippedCards;
            let isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function disableCards() {
            flippedCards[0].classList.add('matched');
            flippedCards[0].classList.remove('flipped');
            flippedCards[1].classList.add('matched');
            flippedCards[1].classList.remove('flipped');
            
            flippedCards = [];
            matchedPairs++;

            if (matchedPairs === totalPairs) {
                setTimeout(() => {
                    alert(`Hai vinto in ${moves} mosse!`);
                    restartButton.style.display = 'inline-block';
                }, 500);
            }
        }

        function unflipCards() {
            lockBoard = true; 

            setTimeout(() => {
                flippedCards[0].classList.remove('flipped');
                flippedCards[1].classList.remove('flipped');
                
                flippedCards = [];
                lockBoard = false;
            }, 1000); 
        }

        restartButton.addEventListener('click', initGame);

        // Avvia il gioco
        initGame();
    </script>
</body>
</html>
